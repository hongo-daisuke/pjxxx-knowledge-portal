name: Frontend Deploy (Direct Login)

# ============================================================
# フロントエンド デプロイ (直接ログイン構成)
#
# 構成:
#   GitHub Actions → 直接 環境アカウントの IAM Role を AssumeRole (1 段)
#
# 用途:
#   sandbox / 個人検証等の独立アカウント環境向け。
#   踏み台アカウントを経由しない直接アクセス構成。
#
# パターン 1 (踏み台 + スイッチロール) を採用するプロジェクトは
#   frontend-deploy-bastion.yml を使用してください。
#
# 必要な事前設定:
#   - GitHub Environments: dev / prd を作成
#   - 各 environment の Secrets: AWS_ROLE_ARN / ENV_FILE
#   - 各 environment の Variables: AWS_REGION / S3_BUCKET_NAME
#   - AWS 側: 各環境アカウントに OIDC + IAM Role 設定
#
# 詳細: docs/github-environments-setup.md / docs/aws-iam-role-setup.md 参照
# ============================================================

on:
  push:
    branches:
      - main             # 本番用メインブランチ → prd 環境
      - dev              # 開発統合ブランチ     → dev 環境
      # 個人作業ブランチを dev 環境へ自動デプロイしたい場合は下記を有効化する (任意)。
      # デフォルトは CLAUDE.md のブランチ戦略 (個人ブランチはデプロイなし) に合わせて無効。
      # 例: 'work/**' は work/login のようなブランチを dev にデプロイする。
      # - 'work/**'

  workflow_dispatch:     # 手動実行も許可

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ブランチ名から environment を動的に決定
    # main → prd / それ以外 → dev
    environment: ${{ github.ref_name == 'main' && 'prd' || 'dev' }}

    concurrency:
      group: frontend-deploy-direct-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      id-token: write    # OIDC トークン発行に必要
      contents: read     # actions/checkout 用

    # コミット (マージコミット) メッセージに [skip-deploy] を含むとスキップ
    # ※ push イベントでは PR ラベルを参照できないため、ラベルではなくメッセージで制御する
    if: ${{ !contains(github.event.head_commit.message, '[skip-deploy]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy info
        run: |
          echo "Branch:  ${{ github.ref_name }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Actor:   ${{ github.actor }}"
          echo "Env:     ${{ github.ref_name == 'main' && 'prd' || 'dev' }}"
          echo "Message: ${{ github.event.head_commit.message }}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'frontend/.nvmrc'
          cache-dependency-path: 'frontend/package-lock.json'
          cache: 'npm'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env file
        # GitHub Environments の Secrets から .env を生成
        # ⚠ Vite は build 時に VITE_XXX を読み込んでバンドルに値を「埋め込む」
        # ⚠ シークレットは GitHub Actions のログ上で自動マスクされるが、
        #   ビルド成果物に埋め込まれるので「フロントに晒して良い値のみ」を入れること
        working-directory: frontend
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE" > .env

      - name: Build
        # 環境別ビルド (vite の --mode を切り替え)
        working-directory: frontend
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npm run build:prd
          else
            npm run build:dev
          fi

      # AWS 認証 (OIDC、1 段 AssumeRole)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3 with backup
        # バックアップロジック:
        #   ケース 1: /bk が存在 → /bk を空にして /app を /bk へコピー
        #   ケース 2: /bk なし & /app なし (初回デプロイ) → スキップ
        #   ケース 3: /bk なし & /app あり → /bk を作成して /app をコピー
        # 最後に dist/ を /app に同期 (/bk は同期先 app/ プレフィックスの外にあるため影響を受けない)
        run: |
          BUCKET="s3://${{ vars.S3_BUCKET_NAME }}"
          APP_PREFIX="app"
          BK_PREFIX="bk"

          APP_FILES=$(aws s3 ls "${BUCKET}/${APP_PREFIX}/" --recursive 2>/dev/null | wc -l | tr -d ' ' || echo 0)
          BK_FILES=$(aws s3 ls "${BUCKET}/${BK_PREFIX}/" --recursive 2>/dev/null | wc -l | tr -d ' ' || echo 0)

          echo "/app ファイル数: ${APP_FILES}"
          echo "/bk  ファイル数: ${BK_FILES}"

          if [ "${BK_FILES}" -gt 0 ]; then
            echo "[ケース1] /bk が存在するため、/bk を削除後に /app を /bk へコピーします。"
            aws s3 rm "${BUCKET}/${BK_PREFIX}/" --recursive
            aws s3 sync "${BUCKET}/${APP_PREFIX}/" "${BUCKET}/${BK_PREFIX}/"
          elif [ "${APP_FILES}" -eq 0 ]; then
            echo "[ケース2] 初回デプロイのため、バックアップ処理をスキップします。"
          else
            echo "[ケース3] /bk が存在しないため、作成して /app を /bk へコピーします。"
            aws s3 sync "${BUCKET}/${APP_PREFIX}/" "${BUCKET}/${BK_PREFIX}/"
          fi

          echo "dist/ を ${BUCKET}/${APP_PREFIX}/ へ同期します。"
          aws s3 sync frontend/dist/ "${BUCKET}/${APP_PREFIX}/" --delete
