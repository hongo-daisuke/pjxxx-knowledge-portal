AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "pjxxx-knowledge-portal backend"

# ============================================================
# Mappings
# ============================================================
Mappings:
  EnvConfig:
    dev:
      LogLevel: DEBUG
      LogRetentionDays: 30
    prd:
      LogLevel: INFO
      LogRetentionDays: 90

# ============================================================
# Parameters
# ============================================================
Parameters:
  Pfx:
    Type: String
    Default: hd
    AllowedPattern: "^[a-z]+$"

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prd]

  ProjectNo:
    Type: String
    Default: pjxxx

  ProjectName:
    Type: String
    Default: knowledge

  # KB / DS ID は 08 構築手順書で構築後に設定する
  KnowledgeBaseId:
    Type: String
    Default: "placeholder"
    Description: Bedrock Knowledge Base ID (手順書 08 で構築後に設定)

  DataSourceId:
    Type: String
    Default: "placeholder"
    Description: Bedrock Knowledge Base Data Source ID

  # クロスリージョン推論プロファイル ARN またはモデル ID
  ModelId:
    Type: String
    Default: "anthropic.claude-3-haiku-20240307-v1:0"
    Description: Bedrock 生成モデル ID (クロスリージョン推論プロファイル ARN も可)

  UserPoolMetaDataUrl:
    Type: String
    Default: init
    Description: Okta SAML メタデータ URL (P3 で設定。未設定は init)

# ============================================================
# Conditions
# ============================================================
Conditions:
  Production: !Equals [!Ref Environment, prd]
  IdpExists: !Not [!Equals [!Ref UserPoolMetaDataUrl, init]]

# ============================================================
# Globals
# ============================================================
Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Layers:
      - !Ref BackendLayer
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !FindInMap [EnvConfig, !Ref Environment, LogLevel]
        MAIN_TABLE_NAME: !Ref MainTable
        IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTable

# ============================================================
# Resources
# ============================================================
Resources:

  # ----------------------------------------------------------
  # [Frontend] S3 Bucket
  # ----------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-frontend"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: knowledge

  # ----------------------------------------------------------
  # [Frontend] API Gateway (SPA 配信)
  # ----------------------------------------------------------
  FrontendRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-frontend-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt FrontendBucket.Arn
                  - !Sub "${FrontendBucket.Arn}/*"

  FrontendApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-frontend"
      StageName: app
      EndpointConfiguration:
        Type: REGIONAL
      Auth:
        DefaultAuthorizer: NONE
        AddDefaultAuthorizerToCorsPreflight: false
        ResourcePolicy:
          CustomStatements:
            - Effect: Allow
              Principal: "*"
              Action: execute-api:Invoke
              Resource: execute-api:/app/*/*
      BinaryMediaTypes:
        - "image/*"
        - "application/javascript"
        - "text/css"
        - "font/*"
      DefinitionBody:
        swagger: "2.0"
        info:
          title: SPA Hosting API
        paths:
          /:
            get:
              x-amazon-apigateway-integration:
                credentials: !GetAtt FrontendRole.Arn
                type: aws
                httpMethod: GET
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${FrontendBucket}/app/index.html"
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Content-Type: integration.response.header.Content-Type
              responses:
                "200":
                  headers:
                    Content-Type:
                      type: string
          /assets/{asset+}:
            get:
              x-amazon-apigateway-integration:
                credentials: !GetAtt FrontendRole.Arn
                type: aws
                httpMethod: GET
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${FrontendBucket}/app/assets/{asset}"
                requestParameters:
                  integration.request.path.asset: method.request.path.asset
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Content-Type: integration.response.header.Content-Type
              parameters:
                - name: asset
                  in: path
                  required: true
                  type: string
              responses:
                "200":
                  headers:
                    Content-Type:
                      type: string
          /{proxy+}:
            get:
              x-amazon-apigateway-integration:
                credentials: !GetAtt FrontendRole.Arn
                type: aws
                httpMethod: GET
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${FrontendBucket}/app/index.html"
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Content-Type: integration.response.header.Content-Type
              responses:
                "200":
                  headers:
                    Content-Type:
                      type: string
    Tags:
      Environment: !Ref Environment
      Project: knowledge

  # ----------------------------------------------------------
  # [Cognito] User Pool
  # ----------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectNo}-${Environment}-${ProjectName}"
      UserPoolTier: LITE
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "OFF"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      Schema:
        - Name: department
          AttributeDataType: String
          Mutable: true
      UserPoolTags:
        Environment: !Ref Environment
        Project: knowledge

  UserPoolGroup_Admin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: 管理者ロール

  UserPoolGroup_Editor:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: editor
      UserPoolId: !Ref UserPool
      Description: 編集者ロール

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${ProjectNo}-${Environment}-${ProjectName}"
      UserPoolId: !Ref UserPool

  UserPoolIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: IdpExists
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Okta
      ProviderType: SAML
      ProviderDetails:
        MetadataURL: !Ref UserPoolMetaDataUrl
      AttributeMapping:
        email: mail
        "custom:department": department

  ApplicationClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: !If [IdpExists, UserPoolIdentityProvider, !Ref AWS::NoValue]
    Properties:
      ClientName: !Sub "${ProjectNo}-${Environment}-${ProjectName}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ReadAttributes:
        - email
        - custom:department
      CallbackURLs:
        - !If
          - Production
          - !Ref AWS::NoValue
          - "http://localhost:5173/"
        - !Sub
          - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/app/"
          - ApiId: !Ref FrontendApi
      LogoutURLs:
        - !If
          - Production
          - !Ref AWS::NoValue
          - "http://localhost:5173/"
        - !Sub
          - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/app/"
          - ApiId: !Ref FrontendApi
      SupportedIdentityProviders:
        - !If [IdpExists, Okta, COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]

  # ----------------------------------------------------------
  # [DynamoDB] Main Table
  # ----------------------------------------------------------
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-main"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [Production, true, false]
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: knowledge

  # ----------------------------------------------------------
  # [DynamoDB] Idempotency Table
  # ----------------------------------------------------------
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-idempotency"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiration
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: knowledge

  # ----------------------------------------------------------
  # [S3] DataBucket (文書ファイル + metadata.json)
  # ----------------------------------------------------------
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-data"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      # presigned URL でブラウザから直接 PUT/GET するため CORS 必須
      # ⚠ prd は AllowedOrigins を実際のフロントオリジンに限定すること
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: documents/
            Function: !GetAtt KbSyncFunction.Arn
          - Event: "s3:ObjectRemoved:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: documents/
            Function: !GetAtt KbSyncFunction.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: knowledge

  # ----------------------------------------------------------
  # [Layer] 共通ライブラリ
  # ----------------------------------------------------------
  BackendLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-library"
      Description: Common Python libraries (aws-lambda-powertools, pydantic, shared code)
      ContentUri: layer/library/
      CompatibleRuntimes: [python3.13]
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: makefile

  # ----------------------------------------------------------
  # [Backend API Gateway]
  # ----------------------------------------------------------
  BackendApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-backend"
      StageName: api
      EndpointConfiguration:
        Type: REGIONAL
      Auth:
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
        DefaultAuthorizer: CognitoAuth
      Cors:
        AllowMethods: "'POST,GET,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type,X-Amz-Date,X-Amz-Security-Token,Idempotency-Key'"
        AllowOrigin: !If [Production, "'https://your-domain.example.com'", "'*'"]
      MethodSettings:
        - LoggingLevel: INFO
          DataTraceEnabled: !If [Production, false, true]
          MetricsEnabled: true
          ResourcePath: "/*"
          HttpMethod: "*"
    Tags:
      Environment: !Ref Environment
      Project: knowledge

  # ----------------------------------------------------------
  # [Lambda] documents-func
  # ----------------------------------------------------------
  DocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-documents"
      CodeUri: lambda_functions/documents/
      Handler: lambda_function.lambda_handler
      Description: 文書CRUD / presigned URL / タグ管理
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          DATA_BUCKET_NAME: !Ref DataBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      Events:
        PostDocuments:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /documents
            Method: POST
        GetDocuments:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /documents
            Method: GET
        GetDocumentById:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /documents/{doc_id}
            Method: GET
        PutDocumentById:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /documents/{doc_id}
            Method: PUT
        DeleteDocumentById:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /documents/{doc_id}
            Method: DELETE
        PostDocumentComplete:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /documents/{doc_id}/complete
            Method: POST
        PostDocumentDownloadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /documents/{doc_id}/download-url
            Method: POST
        GetTags:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /tags
            Method: GET
      ReservedConcurrentExecutions: 20
    Tags:
      Environment: !Ref Environment
      Project: knowledge

  DocumentsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DocumentsFunction}"
      RetentionInDays: !FindInMap [EnvConfig, !Ref Environment, LogRetentionDays]

  # ----------------------------------------------------------
  # [Lambda] chat-func
  # ----------------------------------------------------------
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-chat"
      CodeUri: lambda_functions/chat/
      Handler: lambda_function.lambda_handler
      Description: RAG チャット (Retrieve + Converse)
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          MODEL_ID: !Ref ModelId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
      Events:
        PostChat:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /chat
            Method: POST
        GetChatHistory:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /chat/history
            Method: GET
      ReservedConcurrentExecutions: 10
    Tags:
      Environment: !Ref Environment
      Project: knowledge

  ChatFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChatFunction}"
      RetentionInDays: !FindInMap [EnvConfig, !Ref Environment, LogRetentionDays]

  # ----------------------------------------------------------
  # [Lambda] kb-sync-func
  # ----------------------------------------------------------
  KbSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-kb-sync"
      CodeUri: lambda_functions/kb_sync/
      Handler: lambda_function.lambda_handler
      Description: Knowledge Base ingestion job 制御 (S3 イベント / EventBridge / 手動)
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          DATA_SOURCE_ID: !Ref DataSourceId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:StartIngestionJob
                - bedrock:GetIngestionJob
                - bedrock:ListIngestionJobs
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
      Events:
        PostKbSync:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /kb/sync
            Method: POST
        GetKbStatus:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /kb/status
            Method: GET
        ScheduledSync:
          Type: SchedulerSchedule
          Properties:
            Name: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-sync-schedule"
            Description: 15 分間隔の追随同期
            ScheduleExpression: "rate(15 minutes)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"
      ReservedConcurrentExecutions: 5
    Tags:
      Environment: !Ref Environment
      Project: knowledge

  KbSyncFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${KbSyncFunction}"
      RetentionInDays: !FindInMap [EnvConfig, !Ref Environment, LogRetentionDays]

  # S3 → Lambda 呼び出し許可
  KbSyncFunctionS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt KbSyncFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt DataBucket.Arn

# ============================================================
# Outputs
# ============================================================
Outputs:
  FrontendApiEndpoint:
    Value: !Sub "https://${FrontendApi}.execute-api.${AWS::Region}.amazonaws.com/app/"
    Export:
      Name: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-frontend-endpoint"

  BackendApiEndpoint:
    Value: !Sub "https://${BackendApi}.execute-api.${AWS::Region}.amazonaws.com/api/"
    Export:
      Name: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-backend-endpoint"

  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-user-pool-id"

  UserPoolClientId:
    Value: !Ref ApplicationClient
    Export:
      Name: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-user-pool-client-id"

  UserPoolDomain:
    Value: !Sub "${ProjectNo}-${Environment}-${ProjectName}"
    Export:
      Name: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-user-pool-domain"

  FrontendBucketName:
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-frontend-bucket"

  DataBucketName:
    Value: !Ref DataBucket
    Export:
      Name: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-data-bucket"

  MainTableName:
    Value: !Ref MainTable
    Export:
      Name: !Sub "${Pfx}-${Environment}-${ProjectNo}-${ProjectName}-main-table"
