version = 0.1

[dev]
[dev.deploy]
[dev.deploy.parameters]
disable_rollback = false
stack_name = "pjxxx-knowledge-system-dev"
s3_prefix = "pjxxx-knowledge-system-dev"
region = "ap-northeast-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
image_repositories = []
tags = "ProjectNo=pjxxx Environment=dev Project=knowledge"
parameter_overrides = [
    "Pfx=hd",
    "Environment=dev",
    "ProjectNo=pjxxx",
    "ProjectName=knowledge",
    "KnowledgeBaseId=placeholder",
    "DataSourceId=placeholder",
    "ModelId=anthropic.claude-3-haiku-20240307-v1:0",
    "UserPoolMetaDataUrl=init"
]
no_fail_on_empty_changeset = true

[prd]
[prd.deploy]
[prd.deploy.parameters]
disable_rollback = false
stack_name = "pjxxx-knowledge-system-prd"
s3_prefix = "pjxxx-knowledge-system-prd"
region = "ap-northeast-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
image_repositories = []
tags = "ProjectNo=pjxxx Environment=prd Project=knowledge"
parameter_overrides = [
    "Pfx=hd",
    "Environment=prd",
    "ProjectNo=pjxxx",
    "ProjectName=knowledge",
    "KnowledgeBaseId=placeholder",
    "DataSourceId=placeholder",
    "ModelId=anthropic.claude-3-haiku-20240307-v1:0",
    "UserPoolMetaDataUrl=init"
]
no_fail_on_empty_changeset = true
